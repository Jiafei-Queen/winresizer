# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "winresizer"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Hotkey-driven window resizer"
vendor: "My Company"
homepage: "https://wails.io"
license: "MIT"
release: "1"

contents:
  - src: "./bin/winresizer"
    dst: "/usr/local/bin/winresizer"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/winresizer.png"
  - src: "./build/linux/winresizer.desktop"
    dst: "/usr/share/applications/winresizer.desktop"

# GTK3 + WebKit2GTK 4.1 stack: the app is built with -tags gtk3 because
# wails v3's GTK4 backend does not implement window transparency. Keep these
# in sync with the gtk3 build tag in the linux Taskfile.
depends:
  - libgtk-3-0t64
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

  # Arch Linux packages
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove or others if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# The default GTK4 + WebKitGTK 6.0 stack would need these instead, but it is
# not used because wails v3's GTK4 backend does not implement window
# transparency:
#   deb:  libgtk-4-1, libwebkitgtk-6.0-4
#   rpm:  gtk4, webkitgtk6.0
#   arch: gtk4, webkitgtk-6.0
